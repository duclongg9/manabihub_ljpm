name: ManabiHub CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block generated and local-only files
        run: |
          blocked_files="$(
            git ls-files \
              | grep -E '^(backend/target/|frontend/dist/|frontend/node_modules/|tmp/)|(^|/)(application-secrets\.yml|\.env(\..*)?)$' \
              | grep -v -E '(^|/)\.env.*\.example$' \
              || true
          )"

          if [ -n "$blocked_files" ]; then
            echo "The following generated/local-only files are tracked by Git:"
            echo "$blocked_files"
            echo "Remove them with git rm --cached and keep them ignored."
            exit 1
          fi

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test --batch-mode --no-transfer-progress

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
