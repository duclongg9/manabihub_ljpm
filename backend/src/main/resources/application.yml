spring:
  application:
    name: manabihub-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 28MB
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

manabihub:
  ai:
    chat:
      base-url: ${AI_CHAT_PROVIDER_BASE_URL:}
      endpoint: ${AI_CHAT_PROVIDER_ENDPOINT:/v1/chat/completions}
      api-key: ${AI_CHAT_PROVIDER_API_KEY:}
      model: ${AI_CHAT_PROVIDER_MODEL:gpt-4o-mini}
      rate-limit-per-minute: ${AI_CHAT_RATE_LIMIT_PER_MINUTE:10}
      daily-limit: ${AI_CHAT_DAILY_LIMIT:50}
      timeout-seconds: ${AI_CHAT_TIMEOUT_SECONDS:20}
