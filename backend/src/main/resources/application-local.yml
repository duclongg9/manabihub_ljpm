spring:
  config:
    import: optional:classpath:application-secrets.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:manabihub}
    username: ${DB_USERNAME:manabihub}
    password: ${DB_PASSWORD:manabihub_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Placeholder configuration for OAuth2 client to satisfy auto-configuration triggers
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id-here}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret-here}
            scope:  profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: 8081

app:
  frontend:
    onboarding-url: http://localhost:5173/onboarding/student
    success-url: http://localhost:5173/auth/callback
