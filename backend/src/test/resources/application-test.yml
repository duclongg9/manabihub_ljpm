manabihub:
  security:
    mock-jwt: true
  kyc:
    identity-secret: test-only-identity-secret-key-32chars-minimum-length
  payout:
    security-secret: test-only-payout-secret-key-32chars-minimum-length
  admin-auth:
    cookie-secure: false
    cookie-same-site: Lax

spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 25
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com
