manabihub:
  security:
    mock-jwt: true
  kyc:
    identity-secret: test-only-identity-secret-key-32chars-minimum-length

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5439/manabihub_test
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 25
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com
